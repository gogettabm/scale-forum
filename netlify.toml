# Netlify build + hosting config for a Vite single-page app.

[build]
  command = "npm run build"
  publish = "dist"

# Send every route back to index.html so client-side routing (React Router)
# works on direct visits and refreshes (e.g. /post/5).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
